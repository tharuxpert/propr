name: Propr
options:
  bundleIdPrefix: com.tharuxpert
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  useBaseInternationalization: false
  createIntermediateGroups: true

packages:
  # Forked to fix the incorrect macOS platform requirement (original declares .v26)
  # See: https://github.com/tharuxpert/permiso
  Permiso:
    url: https://github.com/tharuxpert/permiso
    revision: 7b960ad83b514ecf0a097395672ed0674d59f8f0  # Removed Sendable conformance (NSImage fix for Swift 6)

settings:
  SWIFT_VERSION: 6
  SWIFT_STRICT_CONCURRENCY: complete
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""  # Set this in Xcode if you have a paid Apple Developer account (not needed for local testing)

  # Modern build settings (accepted via Xcode's Perform Changes)
  DEAD_CODE_STRIPPING: YES
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Propr:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Propr
        createIntermediateGroups: true
      - path: Resources
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tharuxpert.Propr
      PRODUCT_NAME: Propr
      INFOPLIST_KEY_CFBundleDisplayName: Propr
      INFOPLIST_KEY_LSUIElement: true
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 tharuxpert. All rights reserved."
      # App is agent (menu bar only, no Dock icon)
      # This + LSUIElement hides it from Dock and Cmd+Tab

      # Make sure the custom AppIcon from Assets.xcassets is used
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: Sources/Propr/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        # Accessibility permission description (shown in System Settings)
        NSAccessibilityUsageDescription: "Propr needs Accessibility access to detect when you focus a text field in any app and read the text so it can help you refine it."
        # We will add more privacy strings later if needed (e.g. for future local model features)
    entitlements:
      path: Sources/Propr/Propr.entitlements
      properties:
        # No special entitlements needed for basic Accessibility + menu bar
        # We keep this file for future (e.g. if we add Apple Intelligence or other APIs)
    dependencies:
      - package: Permiso
        product: Permiso
    preBuildScripts: []
    postBuildScripts:
      - name: "Copy Debug build to stable location (for persistent Accessibility permission)"
        script: |
          # This copies the built app to a fixed path so macOS TCC doesn't treat
          # every Xcode build as a new app (common problem with DerivedData + ad-hoc signing).
          DEST="$SRCROOT/Build/Debug/Propr.app"

          echo "→ Copying debug build to stable location..."
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "$TARGET_BUILD_DIR/Propr.app" "$DEST"

          # Ad-hoc re-sign the copy (helps a bit with TCC stability)
          codesign --force --deep --sign - "$DEST" 2>/dev/null || true

          echo "✅ Stable debug build available at:"
          echo "   $DEST"
          echo ""
          echo "   → For development, launch from this location instead of running directly from Xcode:"
          echo "     open \"$DEST\""
          echo ""
          echo "   This prevents having to re-grant Accessibility permission after every build."
        alwaysOutOfDate: true   # Force this script to run on every build (important for xcodebuild + stable permission copy)

schemes:
  Propr:
    build:
      targets:
        Propr: all
    run:
      config: Debug
    archive:
      config: Release
