name: Propr
options:
  bundleIdPrefix: com.tharuxpert
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  useBaseInternationalization: false
  createIntermediateGroups: true

packages:
  # Forked to fix the incorrect macOS platform requirement (original declares .v26)
  # See: https://github.com/tharuxpert/permiso
  Permiso:
    url: https://github.com/tharuxpert/permiso
    revision: 7b960ad83b514ecf0a097395672ed0674d59f8f0  # Removed Sendable conformance (NSImage fix for Swift 6)

settings:
  SWIFT_VERSION: 6
  SWIFT_STRICT_CONCURRENCY: complete
  # CODE_SIGN_STYLE / CODE_SIGN_IDENTITY for Debug come from Configs/Signing.xcconfig.
  # They are deliberately not set here: build settings defined on the target take
  # precedence over an xcconfig, which would silently override the local identity.
  DEVELOPMENT_TEAM: ""  # Set this in Xcode if you have a paid Apple Developer account (not needed for local testing)

  # Modern build settings (accepted via Xcode's Perform Changes)
  DEAD_CODE_STRIPPING: YES
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Propr:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Propr
        createIntermediateGroups: true
      - path: Resources
        createIntermediateGroups: true
    configFiles:
      # Gives Debug builds a stable code signing identity so Accessibility and
      # Keychain grants survive rebuilds. Release is left on Xcode's defaults.
      Debug: Configs/Signing.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tharuxpert.Propr
      PRODUCT_NAME: Propr
      INFOPLIST_KEY_CFBundleDisplayName: Propr
      INFOPLIST_KEY_LSUIElement: true
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 tharuxpert. All rights reserved."
      # App is agent (menu bar only, no Dock icon)
      # This + LSUIElement hides it from Dock and Cmd+Tab

      # Make sure the custom AppIcon from Assets.xcassets is used
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: Sources/Propr/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        # Accessibility permission description (shown in System Settings)
        NSAccessibilityUsageDescription: "Propr needs Accessibility access to detect when you focus a text field in any app and read the text so it can help you refine it."
    entitlements:
      path: Sources/Propr/Propr.entitlements
      properties:
        # No special entitlements needed for basic Accessibility + menu bar
        # We keep this file for future (e.g. if we add Apple Intelligence or other APIs)
    dependencies:
      - package: Permiso
        product: Permiso
      # Xcode runs ExtractAppIntentsMetadata for Swift app targets. Linking the
      # framework keeps that step quiet even though Propr defines no App Intents.
      - sdk: AppIntents.framework
    preBuildScripts: []
    # No post-build copy phase. Run script phases execute *before* Xcode's own
    # CodeSign step, so anything that signs or copies the product here is working
    # on a half-assembled bundle — during `xcodebuild test` that fails outright,
    # because the .xctest bundle is still being embedded into Contents/PlugIns.
    # The stable copy is made by run-debug.sh instead, after xcodebuild returns.
    postBuildScripts: []

  ProprTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ProprTests
    settings:
      # Tests are never shipped; ad-hoc signing is fine and avoids requiring a
      # signing identity just to run them.
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      PRODUCT_BUNDLE_IDENTIFIER: com.tharuxpert.ProprTests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Propr

schemes:
  Propr:
    build:
      targets:
        Propr: all
        ProprTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProprTests
    archive:
      config: Release
