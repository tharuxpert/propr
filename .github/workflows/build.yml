name: Build

on:
  push:
    branches: [main]
    # Docs-only changes cannot break the build. main is not branch-protected, so
    # a skipped run never leaves a PR waiting on a required check.
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']

# A newer push to the same branch or PR makes the running build moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift packages are fetched here instead of into DerivedData, so they can be
  # cached between runs.
  SPM_DIR: ${{ github.workspace }}/.spm

jobs:
  build:
    name: Build & test macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Every package is pinned to a revision in project.yml, so its hash names
      # the exact set of sources.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      # Signing is left enabled, unlike a plain build. The unit tests are hosted in
      # Propr.app, so the app has to actually launch — and on Apple Silicon an
      # unsigned binary will not execute at all. Configs/Signing.xcconfig supplies
      # an ad-hoc identity, which is enough to run; the per-machine
      # Signing.local.xcconfig is gitignored and absent here, as intended.
      - name: Build for testing
        run: |
          xcodebuild \
            -project Propr.xcodeproj \
            -scheme Propr \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Run tests
        run: |
          xcodebuild \
            -project Propr.xcodeproj \
            -scheme Propr \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building
