name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Signing is left enabled, unlike a plain build. The unit tests are hosted in
      # Propr.app, so the app has to actually launch — and on Apple Silicon an
      # unsigned binary will not execute at all. Configs/Signing.xcconfig supplies
      # an ad-hoc identity, which is enough to run; the per-machine
      # Signing.local.xcconfig is gitignored and absent here, as intended.
      - name: Build for testing
        run: |
          xcodebuild \
            -project Propr.xcodeproj \
            -scheme Propr \
            -destination 'platform=macOS,arch=arm64' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Run tests
        run: |
          xcodebuild \
            -project Propr.xcodeproj \
            -scheme Propr \
            -destination 'platform=macOS,arch=arm64' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building
