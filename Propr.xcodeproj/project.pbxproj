			name = "Copy Debug build to stable location (for persistent Accessibility permission)";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# This copies the built app to a fixed path so macOS TCC doesn't treat\n# every Xcode build as a new app (common problem with DerivedData + ad-hoc signing).\nDEST=\"$SRCROOT/Build/Debug/Propr.app\"\n\necho \"→ Copying debug build to stable location...\"\nrm -rf \"$DEST\"\nmkdir -p \"$(dirname \"$DEST\")\"\ncp -R \"$TARGET_BUILD_DIR/Propr.app\" \"$DEST\"\n\n# Ad-hoc re-sign the copy (helps a bit with TCC stability)\ncodesign --force --deep --sign - \"$DEST\" 2>/dev/null || true\n\necho \"✅ Stable debug build available at:\"\necho \"   $DEST\"\necho \"\"\necho \"   → For development, launch from this location instead of running directly from Xcode:\"\necho \"     open \\\"$DEST\\\"\"\necho \"\"\necho \"   This prevents having to re-grant Accessibility permission after every build.\"\n";
		};
